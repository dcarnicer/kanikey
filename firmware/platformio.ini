; KaniKey firmware — first hardware milestone.
;
; Target: M5Stack Cardputer ADV (ESP32-S3FN8, 8 MB flash, no PSRAM,
; 240x135 landscape, TCA8418 keyboard, microSD, Wi-Fi).
;
;   pio run -e cardputer-adv -t upload
;   pio device monitor -b 115200
;
; The first milestone only checks the board: display, keyboard events, SD
; mount, battery and heap. The WaniKani client comes next.

[platformio]
default_envs = cardputer-adv

; Host tests for the pure wk/ modules (no Arduino headers).
;   pio test -e native
[env:native]
platform = native
test_build_src = yes
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Isrc
build_src_filter =
    +<wk/>
    +<ota/>
    +<ui/TextLayout.cpp>
test_filter = test_wk

[env:cardputer-adv]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 8MB
board_build.partitions = partitions/kanikey_8MB.csv
board_build.filesystem = littlefs
build_flags =
    -std=gnu++17
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -Isrc
    -DTGC_BOARD_CARDPUTER_ADV
    -DKANIKEY_ENV=\"cardputer-adv\"
build_unflags =
    -std=gnu++11
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified#e125e73f28b6b83e621e48df432af426bb2ff935

; Development image: keeps the M0 debug screen and the Tab shortcut.
;   pio run -e cardputer-adv-dev
[env:cardputer-adv-dev]
extends = env:cardputer-adv
build_flags =
    ${env:cardputer-adv.build_flags}
    -DKANIKEY_DEV=1

; FIX-20 test image: boots normally, but every WaniKani request fails before a
; socket opens, so it never reports an API success and version 0.1.2 is
; distinct from the running 0.1.0. Install it over the air with tools/ota_local.py.
;   pio run -e cardputer-adv-badapi
[env:cardputer-adv-badapi]
extends = env:cardputer-adv-dev
build_flags =
    ${env:cardputer-adv-dev.build_flags}
    -DKANIKEY_DEV_FAIL_API=1
    '-DKANIKEY_DEV_VERSION="0.1.2"'

; M5Stack PaperDIY (ESP32-S3-WROOM-1-N16R8: 16 MB flash, 8 MB octal PSRAM,
; 4.7" 540x960 e-paper used at 960x540). PD-01 is board/build bring-up;
; PD-02 owns the e-paper UI and present policy.
;   pio run -e paperdiy -t upload
[env:paperdiy]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions/kanikey_16MB.csv
board_build.filesystem = littlefs
build_flags =
    -std=gnu++17
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -Isrc
    -DTGC_BOARD_PAPERDIY
    -DKANIKEY_ENV=\"paperdiy\"
build_unflags =
    -std=gnu++11
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified#e125e73f28b6b83e621e48df432af426bb2ff935
    m5stack/M5GFX@0.3.0

; Development image: keeps the M0 debug screen and the Tab shortcut (there is
; no keyboard on PaperDIY, so most dev keys are unreachable until PD-03).
[env:paperdiy-dev]
extends = env:paperdiy
build_flags =
    ${env:paperdiy.build_flags}
    -DKANIKEY_DEV=1
