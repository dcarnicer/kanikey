; KaniKey firmware — first hardware milestone.
;
; Target: M5Stack Cardputer ADV (ESP32-S3FN8, 8 MB flash, no PSRAM,
; 240x135 landscape, TCA8418 keyboard, microSD, Wi-Fi).
;
;   pio run -e cardputer-adv -t upload
;   pio device monitor -b 115200
;
; The first milestone only checks the board: display, keyboard events, SD
; mount, battery and heap. The WaniKani client comes next.

[platformio]
default_envs = cardputer-adv

; Memory-tuned Arduino-ESP32 core (MEM-02, docs/spec/12-memory.md). PlatformIO
; rebuilds the ESP32-S3 core libraries on the first build of an env that uses
; this section (see the "Custom core" note in firmware/README.md) and
; reuses them afterwards. Only the Cardputer envs use it: the core is one global
; directory per chip, and PaperDIY's octal-PSRAM memory type gives a different
; core, so switching between the two rebuilds it each time. PaperDIY stays on the
; prebuilt libraries.
;
; The pre: script is the pioarduino cache check fix from paperdiy-reader-fix-battery
; (scripts/patch_pioarduino_cache.py). Without it, pioarduino treats any custom core
; as the state for every env on the machine.
[mem_tuned]
extra_scripts =
    pre:scripts/patch_pioarduino_cache.py
custom_sdkconfig =
    ; TLS record buffers. The input side keeps 16 KB records (servers may send
    ; them); the output side only carries small requests, so 4 KB is enough.
    ; Saves the difference per connection (IDF: 12 KB at 16 KB out, MEM-02 table).
    CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
    CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
    CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
    ; FatFs buffers (FF_MAX_SS) follow this choice: ffconf.h sets FF_SS_SDCARD to a
    ; fixed 512 and takes the larger of it and CONFIG_WL_SECTOR_SIZE, which is
    ; derived from this choice (set the choice member, not the integer: the integer
    ; alone stayed at 4096 in the generated sdkconfig). The SD card uses 512-byte
    ; sectors, and no FFat or wear-levelled partition is used.
    CONFIG_WL_SECTOR_SIZE_512=y
    CONFIG_WL_SECTOR_SIZE_4096=n
    ; Move the Wi-Fi hot paths back from IRAM to flash. On the S3 the freed IRAM
    ; is SRAM the heap can use. Costs some Wi-Fi throughput (OTA download time).
    CONFIG_ESP_WIFI_IRAM_OPT=n
    CONFIG_ESP_WIFI_RX_IRAM_OPT=n
    CONFIG_ESP_WIFI_EXTRA_IRAM_OPT=n
    ; CSI and FTM are not used. Arduino's initiateFTM() is not guarded by the
    ; FTM option, so this key is verified by the link, not by the compile.
    CONFIG_ESP_WIFI_CSI_ENABLED=n
    CONFIG_ESP_WIFI_FTM_ENABLE=n
    ; Management frame buffers, 32 -> 16. Arduino overrides the dynamic RX and TX
    ; counts at WiFiGeneric.cpp:286 (dynamic_rx_buf_num = 32), so those keys have
    ; no effect and are left out. MGMT_SBUF is not overridden.
    CONFIG_ESP_WIFI_MGMT_SBUF_NUM=16
    ; Timer and FreeRTOS timer task stacks, measured high-water marks (paperdiy
    ; reader, July 2026): esp_timer used under 1 KB of 8 KB; the timer service
    ; under 1 KB of 4 KB.
    CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
    CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2560
    ; Compile only the Arduino libraries the firmware and its lib_deps use. The
    ; list was checked against firmware/src and the M5Unified/M5GFX source trees
    ; (not examples). SD, LittleFS, FS, WiFi, WiFiClientSecure, WebServer, Update,
    ; Preferences, SPI and Wire stay on: M5GFX's ESP32 platform includes SPI and Wire.
    CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
    CONFIG_ARDUINO_SELECTIVE_ArduinoOTA=n
    CONFIG_ARDUINO_SELECTIVE_BLE=n
    CONFIG_ARDUINO_SELECTIVE_BluetoothSerial=n
    CONFIG_ARDUINO_SELECTIVE_DNSServer=n
    CONFIG_ARDUINO_SELECTIVE_EEPROM=n
    CONFIG_ARDUINO_SELECTIVE_ESPmDNS=n
    CONFIG_ARDUINO_SELECTIVE_ESP_SR=n
    CONFIG_ARDUINO_SELECTIVE_ESP_Video=n
    CONFIG_ARDUINO_SELECTIVE_Ethernet=n
    CONFIG_ARDUINO_SELECTIVE_FFat=n
    CONFIG_ARDUINO_SELECTIVE_HTTPClient=n
    CONFIG_ARDUINO_SELECTIVE_Insights=n
    CONFIG_ARDUINO_SELECTIVE_Matter=n
    CONFIG_ARDUINO_SELECTIVE_NetBIOS=n
    CONFIG_ARDUINO_SELECTIVE_OpenThread=n
    CONFIG_ARDUINO_SELECTIVE_PPP=n
    CONFIG_ARDUINO_SELECTIVE_RainMaker=n
    CONFIG_ARDUINO_SELECTIVE_SD_MMC=n
    CONFIG_ARDUINO_SELECTIVE_SPIFFS=n
    CONFIG_ARDUINO_SELECTIVE_SimpleBLE=n
    CONFIG_ARDUINO_SELECTIVE_Ticker=n
    CONFIG_ARDUINO_SELECTIVE_WiFiProv=n
    CONFIG_ARDUINO_SELECTIVE_Zigbee=n
    ; Bluetooth stays enabled: BT-01 plans a BLE keyboard. The Arduino BLE and
    ; SimpleBLE wrappers are off; a NimBLE-Arduino library does not need them.
    CONFIG_BT_ENABLED=y
    ; Core dumps and IPv4 are left as the prebuilt core sets them. IPv6
    ; (CONFIG_LWIP_IPV6) and CONFIG_MBEDTLS_DYNAMIC_BUFFER are the optional
    ; settings below, not enabled; see docs/spec/12-memory.md (MEM-02).
    ; CONFIG_LWIP_IPV6=n
    ; CONFIG_MBEDTLS_DYNAMIC_BUFFER=y
custom_component_remove =
    espressif/esp_insights
    espressif/esp_rainmaker
    espressif/esp_diagnostics
    espressif/esp_diag_data_store
    espressif/cbor
    espressif/esp-zboss-lib
    espressif/esp-zigbee-lib
    espressif/esp-sr

; Host tests for the pure wk/ modules (no Arduino headers).
;   pio test -e native
[env:native]
platform = native
test_build_src = yes
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Isrc
build_src_filter =
    +<wk/>
    +<ota/>
    +<ui/TextLayout.cpp>
test_filter = test_wk

[env:cardputer-adv]
extends = mem_tuned
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 8MB
board_build.partitions = partitions/kanikey_8MB.csv
board_build.filesystem = littlefs
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    ; The fixed 512-byte FatFs (CONFIG_WL_SECTOR_SIZE_512) has no FATFS::ssize field.
    ; Arduino's SD library reads it unless _MAX_SS says the sector size is 512.
    -D_MAX_SS=512
    -DTGC_BOARD_CARDPUTER_ADV
    -DKANIKEY_ENV=\"cardputer-adv\"
; The firmware builds with the framework's own C++ standard (gnu++2b in
; Arduino-ESP32 3.x). Forcing gnu++17 here linked part of the Matter library
; (+560 KB flash, +20 KB static RAM, 2026-11-20); the native tests stay gnu++17.
build_unflags =
    -std=gnu++11
; -Isrc applies to the project sources only. As a build flag it also reached the
; managed libsodium component, whose #include "version.h" resolved to src/Version.h
; on macOS's case-insensitive filesystem (a C++ header) and failed to compile.
build_src_flags =
    -Isrc
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified#96576a14247ddc935149145aa6b51943464120f1
    m5stack/M5GFX@0.3.0

; Development image: keeps the M0 debug screen and the Tab shortcut. It keeps
; the library log level 1 (the release image is level 0, see FLASH-02): the
; inherited -DCORE_DEBUG_LEVEL=0 is removed with build_unflags, then level 1 is set.
;   pio run -e cardputer-adv-dev
[env:cardputer-adv-dev]
extends = env:cardputer-adv
build_flags =
    ${env:cardputer-adv.build_flags}
    -DCORE_DEBUG_LEVEL=1
    -DKANIKEY_DEV=1
build_unflags =
    ${env:cardputer-adv.build_unflags}
    -DCORE_DEBUG_LEVEL=0

; FIX-20 test image: boots normally, but every WaniKani request fails before a
; socket opens, so it never reports an API success and version 0.1.2 is
; distinct from the running 0.1.0. Install it over the air with tools/ota_local.py.
;   pio run -e cardputer-adv-badapi
[env:cardputer-adv-badapi]
extends = env:cardputer-adv-dev
build_flags =
    ${env:cardputer-adv-dev.build_flags}
    -DKANIKEY_DEV_FAIL_API=1
    '-DKANIKEY_DEV_VERSION="0.1.2"'

; M5Stack PaperDIY (ESP32-S3-WROOM-1-N16R8: 16 MB flash, 8 MB octal PSRAM,
; 4.7" 540x960 e-paper used at 960x540). PD-01 is board/build bring-up;
; PD-02 owns the e-paper UI and present policy.
; Not on [mem_tuned]: octal PSRAM (qio_opi) is a different core from the Cardputer's
; (qio_qspi), and PlatformIO rebuilds the shared core on every switch between them.
;   pio run -e paperdiy -t upload
[env:paperdiy]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions/kanikey_16MB.csv
board_build.filesystem = littlefs
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -Isrc
    -DTGC_BOARD_PAPERDIY
    -DKANIKEY_ENV=\"paperdiy\"
; The firmware builds with the framework's own C++ standard (gnu++2b in
; Arduino-ESP32 3.x). Forcing gnu++17 here linked part of the Matter library
; (+560 KB flash, +20 KB static RAM, 2026-11-20); the native tests stay gnu++17.
build_unflags =
    -std=gnu++11
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified#96576a14247ddc935149145aa6b51943464120f1
    m5stack/M5GFX@0.3.0

; Development image: keeps the M0 debug screen and the Tab shortcut (there is
; no keyboard on PaperDIY, so most dev keys are unreachable until PD-03).
[env:paperdiy-dev]
extends = env:paperdiy
build_flags =
    ${env:paperdiy.build_flags}
    -DKANIKEY_DEV=1
